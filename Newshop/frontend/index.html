<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نیوشاپ - فروشگاه گجت و کالای دیجیتال</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>
    <!-- پس‌زمینه متحرک -->
    <div class="bg-wrapper">
        <div class="bg-blob bg-blob--1"></div>
        <div class="bg-blob bg-blob--2"></div>
        <div class="bg-blob bg-blob--3"></div>
    </div>

    <!-- هدر اصلی -->
    <header class="header liquid-nav" id="header">
        <div class="liquid-glare-container">
            <div class="liquid-glare" id="glare"></div>
        </div>

        <div class="header__inner">
            <!-- لوگو -->
            <a href="#" class="header__logo">
                <span class="logo__text">نیوشاپ</span>
                
                <span class="logo__dot-wrapper">
                    <span class="logo__dot"></span>
                    <span class="logo__orbit"></span>
                    <span class="logo__particle logo__particle--1"></span>
                    <span class="logo__particle logo__particle--2"></span>
                    <span class="logo__particle logo__particle--3"></span>
                </span>
            </a>

            <!-- فرم جستجو -->
            <form class="header__search" id="search-form">
                <button type="submit" class="search__icon-btn" aria-label="جستجو">
                    <img src="assets/icons/search.webp" alt="جستجو"
                        class="search-icon">
                </button>
                <input type="text" class="search__input" placeholder="جستجوی گوشی، لپ‌تاپ، ساعت..." id="search-input">
            </form>

            <!-- اکشن‌ها -->
            <div class="header__actions">
                <!-- تم دارک/لایت -->
                <div class="action-item">
                    <button class="action__btn theme-btn" id="theme-toggle" aria-label="تغییر تم">
                        <div class="theme-icon-wrapper">
                            <img src="assets/icons/sun.webp" alt="تم روشن" class="theme-icon sun-icon"
                                id="theme-light-icon">
                            <img src="assets/icons/moon.webp"
                                alt="تم تاریک" class="theme-icon moon-icon" id="theme-dark-icon">
                        </div>
                    </button>
                    <span class="action-label">تم</span>
                </div>

                <!-- حساب کاربری -->
                <div class="action-item">
                    <button class="action__btn" id="account-btn" aria-label="حساب کاربری">
                        <img  src="assets/icons/user.webp" alt="حساب کاربری"
                            class="user-icon">
                    </button>
                    <span class="action-label">حساب کاربری</span>
                </div>

                <!-- سبد خرید -->
                <div class="action-item">
                    <button class="action__btn cart-btn" id="cart-btn" aria-label="سبد خرید">
                        <img src="assets/icons/cart.webp" alt="سبد خرید"
                            class="cart-icon">
                        <span class="cart__badge" id="cart-badge">3</span>
                    </button>
                    <span class="action-label">سبد خرید</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="hero">
            <h1 class="hero__title">آینده تکنولوژی، همینجا</h1>
            <p class="hero__desc">
                جدیدترین گجت‌ها را با بهترین قیمت از
                <span class="hero__highlight">نیوشاپ</span> بخرید
            </p>
        </section>
    </main>

    <script src="assets/js/main.js"></script>
</body>

</html>
