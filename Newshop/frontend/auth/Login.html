<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Animated Login &amp; Register Form</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/fonts.css">
<style>
/* ===== متغیرهای اصلی (برگرفته از style.css) ===== */
:root {
    --primary: #00d4ff;
    --primary-dark: #0099cc;
    --primary-light: #66e5ff;
    --secondary: #b700ff;
    --accent: #ff00d4;
    --success: #00ff88;
    --danger: #ff3366;
    --warning: #ffaa00;
    --info: #00ffff;
    
    --bg-body: #f0f4f8;
    --bg-surface: #ffffff;
    --bg-card: rgba(255, 255, 255, 0.95);
    --bg-header: rgba(255, 255, 255, 0.95);
    --bg-footer: #ffffff;
    
    --text-primary: #1a1a2e;
    --text-secondary: #4a4a6a;
    --text-muted: #5a5a7a;
    
    --border-color: rgba(0, 212, 255, 0.3);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
    --shadow-neon: 0 0 20px rgba(0, 212, 255, 0.5);
    --shadow-neon-strong: 0 0 30px rgba(0, 212, 255, 0.7), 0 0 15px rgba(112, 0, 255, 0.5);
    
    --radius-card: 1rem;
    --radius-button: 2.5rem;
    --radius-circle: 50%;
    
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --font-xs: 0.75rem;
    --font-sm: 0.875rem;
    --font-base: 1rem;
    --font-lg: 1.125rem;
    --font-xl: 1.25rem;
    --font-2xl: 1.625rem;
    --font-3xl: 2.125rem;
    --font-4xl: 2.75rem;
    --font-5xl: 3.625rem;
    
    --z-base: 1;
    --z-sticky: 200;
    --z-header: 1000;
    --z-loader: 9999;
}

body.dark {
    --bg-body: #0a0a0f;
    --bg-surface: #0f0f1a;
    --bg-card: rgba(15, 15, 26, 0.95);
    --bg-header: rgba(10, 10, 15, 0.95);
    --bg-footer: #0a0a0f;
    --text-primary: #ffffff;
    --text-secondary: #b0b0c0;
    --text-muted: #7a7a9a;
}

/* ===== ریست پایه ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Vazir', 'Vazirmatn', sans-serif;
    color: #fff;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg-body), #1a0a2e, #2a1040);
}

/* ===== دکمه بازگشت به خانه ===== */
.back-home {
    position: absolute;           /* نسبت به container */
    top: 15px;                   /* فاصله از بالای container */
    right: 15px;                 /* فاصله از راست (برای RTL) */
    width: auto;
    height: auto;
    padding: 8px;
    border-radius: 50px;
    background: rgb(53, 56, 255);
    backdrop-filter: blur(12px);
    border: 1px solid var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
    text-decoration: none;
    box-shadow: 0 0 12px rgba(0, 212, 255, 0.3);
    transition: all var(--transition);
    z-index: 15;                 /* بالاتر از ورق‌ها و فرم‌ها */
}
.back-home:hover {
    background: var(--primary);
    color: #0a0a0f;
    box-shadow: var(--shadow-neon);
    transform: scale(1.1);
}
.back-home svg {
    width: 1.3rem;
    height: 1.3rem;
    stroke: currentColor;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* ===== کانتینر اصلی ===== */
.container {
    position: relative;
    width: 850px;
    height: 500px;
    border: 2px solid var(--primary);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-neon);
    overflow: hidden;
    background: transparent;
}

/* ===== ورق‌های منحنی ===== */
.curved-shape {
    position: absolute;
    left: 0;
    top: -5px;
    height: 600px;
    width: 850px;
    background: linear-gradient(45deg, #8d8dff, var(--primary));
    transform: rotate(-10deg) skewY(-40deg);
    transform-origin: bottom left;
    transition: 1.5s ease;
    transition-delay: 1.6s;
}
.container.active .curved-shape {
    transform: rotate(0deg) skewY(0deg);
    transition-delay: .5s;
}

.curved-shape2 {
    position: absolute;
    right: 250px;
    top: 100%;
    height: 700px;
    width: 850px;
    background: var(--bg-surface);
    border-top: 3px solid var(--primary);
    transform: rotate(0deg) skewY(0deg);
    transform-origin: bottom right;
    transition: 1.5s ease;
    transition-delay: .5s;
}
.container.active .curved-shape2 {
    transform: rotate(11deg) skewY(41deg);
    transition-delay: 1.2s;
}

/* ===== جعبه‌های فرم ===== */
.form-box {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    display: flex;
    justify-content: center;
    flex-direction: column;
}

/* راست‌چین: فرم ورود در سمت راست */
.form-box.Login {
    right: 0;
    padding: 0 50px;
}
.form-box.Register {
    left: 0;
    padding: 0 70px;
}

/* انیمیشن‌ها */
.animation {
    transition: transform 0.7s ease, opacity 0.7s ease, filter 0.7s ease;
}

.form-box.Login .animation {
    transform: translateX(0%);
    opacity: 1;
    transition-delay: calc(0.1s * var(--S));
}
.container.active .form-box.Login .animation {
    transform: translateX(120%);    /* راست خارج شود */
    opacity: 0;
    transition-delay: calc(0.1s * var(--D));
}

.form-box.Register .animation {
    transform: translateX(-120%);
    opacity: 0;
    filter: blur(10px);
    transition-delay: calc(0.1s * var(--S));
}
.container.active .form-box.Register .animation {
    transform: translateX(0%);
    opacity: 1;
    filter: blur(0px);
    transition-delay: calc(0.1s * var(--li));
}

.form-box h2 {
    font-size: 32px;
    text-align: center;
    color: var(--text-primary);
    margin-bottom: 1.8rem;
}

/* ===== فیلدهای ورودی ===== */
.input-box {
    position: relative;
    width: 100%;
    height: 50px;
    margin: 25px 0;   /* فقط بالا و پایین فاصله داشته باشد */
    padding: 0;
}
.input-box input {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    font-size: 16px;
    color: rgb(137, 137, 255);
    font-weight: 500;
    border: 2px solid rgba(47, 0, 255, 0.3);
    border-radius:50px;
    padding-left: 30px;
    padding-right: 30px;          /* جای آیکون */
    transition: border-color 0.5s;
}


.input-box label {
    position: absolute;
    top: 50%;
    right: 15px;
    transform: translateY(-50%);
    font-size: 16px;
    color: var(--text-secondary);
    transition: 0.5s;
    pointer-events: none;
}
.input-box input:focus ~ label,
.input-box input:valid ~ label {
    top: -12px;
    right: 15px;
    color: var(--primary);
    font-size: 16px;
}
.input-box box-icon {
    position: absolute;
    top: 50%;
    left: 15px;
    transform: translateY(-50%);
    font-size: 18px;
    color: var(--text-secondary);
    transition: 0.5s;
}
.input-box input:focus ~ box-icon,
.input-box input:valid ~ box-icon {
    color: var(--primary);
}

/* ===== دکمه‌ها ===== */
.btn {
    position: relative;
    width: 100%;
    height: 45px;
    background: transparent;
    border-radius: 40px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    border: 2px solid var(--primary);
    color: var(--text-primary);
    overflow: hidden;
    z-index: 1;
    

    transition: all 0.3s;
}
.btn::before {
    content: "";
    position: absolute;
    height: 300%;
    width: 100%;
    background: linear-gradient(var(--bg-surface), var(--primary), var(--bg-surface), var(--primary));
    top: -100%;
    left: 0;
    z-index: -1;
    transition: 0.5s;
}
.btn:hover::before {
    top: 0;
}
.btn:hover {
    border-color: var(--secondary);
    box-shadow: 0 0 15px var(--primary);
}

/* ===== لینک‌های ثبت‌نام / ورود ===== */
.regi-link {
    font-size: 14px;
    text-align: center;
    margin: 10px 0 5px;   /* قبلاً 20px 0 10px */
}
.regi-link p {
    margin-bottom: 0.6rem;
    color: var(--text-secondary);
}
.btn, .regi-btn {
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.regi-btn {
    display: inline-block;
    padding: 0.5rem 1.8rem;
    border: 1px solid var(--primary);
    border-radius: 2rem;
    color: var(--primary) !important;
    background: rgba(0, 212, 255, 0.08);
    backdrop-filter: blur(10px);
    font-size: 0.95rem;
    font-weight: 600;
    transition: all var(--transition);
    text-decoration: none !important;
    width: 100%;          /* عرض کامل مثل بقیه دکمه‌ها */
    box-sizing: border-box; /* تا padding داخل عرض محاسبه شود */
    /* margin-right: 27px;  این خط را حذف کن */
    
    
}
.regi-btn:hover {
    background: var(--primary);
    color: var(--bg-body) !important;
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
    transform: translateY(-2px);
}

/* ===== اطلاعات کنار فرم ===== */
.info-content {
    position: absolute;
    top: 0;
    height: 100%;
    width: 50%;
    display: flex;
    justify-content: center;
    flex-direction: column;
}
.info-content.Login {
    left: 0;
    text-align: left;
    padding: 0 150px 60px 40px;
}
.info-content.Register {
    right: 0;
    text-align: right;
    padding: 0 40px 60px 150px;
    pointer-events: none;
}

.info-content .animation {
    transition: transform 0.7s ease, opacity 0.7s ease, filter 0.7s ease;
}

.info-content.Login .animation {
    transform: translateX(0);
    opacity: 1;
    filter: blur(0px);
    transition-delay: calc(0.1s * var(--S));
}
.container.active .info-content.Login .animation {
    transform: translateX(-120%);
    opacity: 0;
    filter: blur(10px);
    transition-delay: calc(0.1s * var(--D));
}

.info-content.Register .animation {
    transform: translateX(120%);
    opacity: 0;
    filter: blur(10px);
    transition-delay: calc(0.1s * var(--S));
}
.container.active .info-content.Register .animation {
    transform: translateX(0%);
    opacity: 1;
    filter: blur(0);
    transition-delay: calc(0.1s * var(--li));
}

.info-content h2 {
    text-transform: uppercase;
    font-size: 36px;
    line-height: 1.3;
    color: var(--text-primary);
    margin-bottom: 1rem;
}
.info-content p {
    font-size: 16px;
    color: var(--text-secondary);
}

/* ===== واکنش‌گرایی ===== */
@media (max-width: 768px) {
    .container {
        width: 95vw;
        height: auto;
        min-height: 500px;
    }
    .form-box, .info-content {
        width: 100%;
        padding: 20px;
        left: 0;
        right: 0;
    }
    .info-content {
        display: none;
    }
}
/* حذف فاصله اضافه بین دکمه اصلی و دکمه لینک */
.input-box {
    margin: 15px 0 5px !important;   /* بالا 15px، پایین 5px */
}

.regi-link {
    margin: 0 !important;            /* همه marginها صفر */
}

.regi-btn {
    margin-top: 0 !important;        /* فاصله بالای دکمه لینک صفر */
}
/* فقط فاصلهٔ رمز عبور از بالا بیشتر شود (در فرم ورود) */
.form-box.Login .input-box:nth-child(2) {
    margin-top: 25px !important;
}
.form-box.Register .input-box:nth-child(2) {
    margin-top: 25px !important;
}
.form-box.Register .input-box {
    margin-top: 25px !important;
}
</style>
</head>
<body>




<div class="container">
    <a href="../shop/home/index.html" class="back-home" title="بازگشت به خانه">
    بازگشت
</a>
    <div class="curved-shape"></div>
    <div class="curved-shape2"></div>

    <div class="form-box Login">
        <h2 class="animation" style="color: #66e5ff;" style="--D:0; --S:21">ورود</h2>
        <form action="#">
            <div class="input-box animation" style="--D:1; --S:22">
                <input type="text" required>
                <label>نام کاربری</label>
                <box-icon type='solid' name='user' color="gray"></box-icon>
            </div>
            <div class="input-box animation" style="--D:2; --S:23">
                <input type="password" required>
                <label>رمز عبور</label>
                <box-icon name='lock-alt' type='solid' color="gray"></box-icon>
            </div>
            <div class="input-box animation" style="--D:3; --S:24">
                <button class="btn" type="submit">ورود</button>
            </div>
            <div class="regi-link animation" style="--D:4; --S:25">
                
                <a href="#" class="SignUpLink regi-btn">ثبت‌نام</a>
            </div>
        </form>
    </div>

    <div class="info-content Login">
        <h2 class="animation" style="--D:0; --S:20">خوش برگشتید!</h2>
    </div>

    <div class="form-box Register">
        <h2 class="animation" style="--li:17; --S:0">ثبت‌نام</h2>
        <form action="#">
            <div class="input-box animation" style="--li:18; --S:1">
                <input type="text" required>
                <label>نام کاربری</label>
                <box-icon type='solid' name='user' color="gray"></box-icon>
            </div>
            <div class="input-box animation" style="--li:19; --S:2">
                <input type="email" required>
                <label>ایمیل</label>
                <box-icon name='envelope' type='solid' color="gray"></box-icon>
            </div>
            <div class="input-box animation" style="--li:19; --S:3">
                <input type="password" required>
                <label>رمز عبور</label>
                <box-icon name='lock-alt' type='solid' color="gray"></box-icon>
            </div>
            <div class="input-box animation" style="--li:20; --S:4">
                <button class="btn" type="submit">ثبت‌نام</button>
            </div>
            <div class="regi-link animation" style="--li:21; --S:5">
                
                <a href="#" class="SignInLink regi-btn">ورود</a>
            </div>
        </form>
    </div>

    <div class="info-content Register">
        <h2 class="animation" style="--li:17; --S:0">خوش آمدید!</h2>
    </div>
    
</div>

const RegisterLink = document.querySelector('.SignUpLink');

RegisterLink.addEventListener('click', () =>{
    container.classList.add('active');
})

LoginLink.addEventListener('click', () => {
    container.classList.remove('active');
})
</script>
