{% extends "base.html" %}
{% load static %}


{% block content %}
<section class="hero-banner">

    <a href="/shop/" class="banner-link">

        <div class="banner-slider" id="bannerSlider">

            <img 
                src="{% static 'images/banners/desktop-banner.webp' %}" 
                id="banner-image"
                class="banner-current"
                draggable="false"
            >

            <img 
                id="banner-next-image"
                class="banner-next"
                draggable="false"
            >

        </div>

    </a>


    <button id="banner-next" class="banner-btn prev">
        ›
    </button>


    <button id="banner-prev" class="banner-btn next">
        ‹
    </button>


    <div class="banner-progress">
        <span id="banner-progress-bar"></span>
    </div>


    <div class="banner-dots" id="banner-dots"></div>


</section>
<section class="categories-box">


    <div class="categories-header">

        <h2>
            دسته بندی محصولات
        </h2>


        <a href="#" class="view-all-btn">
            مشاهده همه
        </a>


    </div>



    <div class="categories-wrapper">


        <button class="category-arrow right">
            ❮
        </button>



        <div class="categories-scroll">


            <a href="#" class="category-card mobile">
                <div class="category-icon">
                    <img src="{% static 'icons/categories/stash--smartphone-light.svg' %}">
                </div>
                <span>موبایل</span>
            </a>


            <a href="#" class="category-card laptop">
                <div class="category-icon">
                    <img src="{% static 'icons/categories/iconoir--laptop.svg' %}">
                </div>
                <span>لپ تاپ</span>
            </a>


            <a href="#" class="category-card watch">
                <div class="category-icon">
                    <img src="{% static 'icons/categories/fluent--smartwatch-20-regular.svg' %}">
                </div>
                <span>ساعت هوشمند</span>
            </a>


            <a href="#" class="category-card monitor">
                <div class="category-icon">
                    <img src="{% static 'icons/categories/mdi-light--monitor.svg' %}">
                </div>
                <span>مانیتور</span>
            </a>


            <a href="#" class="category-card headphone">
                <div class="category-icon">
                    <img src="{% static 'icons/categories/icon-park-solid--airpods.svg' %}">
                </div>
                <span>هندزفری</span>
            </a>


            <a href="#" class="category-card accessories">
                <div class="category-icon">
                    <img src="{% static 'icons/categories/lucide--cable.svg' %}">
                </div>
                <span>لوازم جانبی</span>
            </a>


            <a href="#" class="category-card gaming">
                <div class="category-icon">
                    <img src="{% static 'icons/categories/solar--gamepad-bold.svg' %}">
                </div>
                <span>گجت و گیم</span>
            </a>


            <a href="#" class="category-card tools">
                <div class="category-icon">
                    <img src="{% static 'icons/categories/vaadin--tools.svg' %}">
                </div>
                <span>ابزار آلات</span>
            </a>


            <a href="#" class="category-card network">
                <div class="category-icon">
                    <img src="{% static 'icons/categories/bi--router-fill.svg' %}">
                </div>
                <span>شبکه</span>
            </a>


            <a href="#" class="category-card tablet">
                <div class="category-icon">
                    <img src="{% static 'icons/categories/solar--tablet-linear.svg' %}">
                </div>
                <span>تبلت</span>
            </a>


        </div>




        <button class="category-arrow left">
            ❯
        </button>


    </div>


</section>
<!-- ==========================
     FLASH SALE
========================== -->

<section class="flash-section">

    <div class="flash-bg">

        <!-- Discount Icon -->
        <div class="flash-discount-icon">
            <img
                src="/static/icons/discount.png"
                alt="پیشنهاد شگفت‌انگیز"
            >
        </div>


        <!-- Flash Header -->
        <div class="flash-header">

            <h2 class="flash-title">
                پیشنهاد شگفت‌انگیز
            </h2>

            <a href="#" class="flash-all">
                مشاهده همه
            </a>

        </div>
        <!-- ==========================
            FLASH PRODUCTS
        ========================== -->

        <div class="flash-products-area">

            <div class="flash-products">

                <!-- Product cards will be added here -->

            </div>

        </div>

    </div>

</section>
{% endblock %}
