<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت پشتیبانی | نیوشاپ</title>
    <style>
        /* ===== ریست و متغیرها ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f0f4f8;
            --surface: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #4a4a6a;
            --primary: #00d4ff;
            --primary-dark: #0099cc;
            --secondary: #7000ff;
            --accent: #ff00d4;
            --border: rgba(0,0,0,0.08);
            --msg-bot: #ffffff;
            --msg-user: linear-gradient(135deg, #00d4ff, #7000ff);
            --shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        body.dark {
            --bg: #0a0a0f;
            --surface: #0f0f1a;
            --text: #ffffff;
            --text-secondary: #b0b0c0;
            --border: rgba(255,255,255,0.08);
            --msg-bot: #1a1a2e;
        }
        body {
            font-family: 'Vazir', 'Vazirmatn', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        /* ===== هدر ===== */
        .chat-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: var(--shadow);
            z-index: 10;
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(0,0,0,0.05); }
        .chat-header-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }
        .chat-title {
            font-weight: 700;
            font-size: 1.1rem;
            line-height: 1.3;
        }
        .chat-subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* ===== بخش پیام‌ها ===== */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }
        .message {
            display: flex;
            gap: 0.5rem;
            max-width: 85%;
            animation: fadeInUp 0.3s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.bot {
            align-self: flex-start;
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .bubble {
            padding: 0.7rem 1rem;
            border-radius: 1rem;
            line-height: 1.6;
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        .bot .bubble {
            background: var(--msg-bot);
            border: 1px solid var(--border);
            border-bottom-right-radius: 0.2rem;
        }
        .user .bubble {
            background: var(--msg-user);
            color: white;
            border-bottom-left-radius: 0.2rem;
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 0.5rem 0;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ===== فوتر ===== */
        .chat-footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 0.6rem 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .chat-input {
            flex: 1;
            padding: 0.7rem 1rem;
            border-radius: 2rem;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .chat-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
        }
        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0,212,255,0.4);
        }
        .send-btn:active { transform: scale(0.95); }

        /* اسکرول‌بار */
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        body.dark .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }
    </style>
    <link rel="stylesheet" href="../../assets/css/fonts.css">
    
</head>
<body>
    <header class="chat-header">
        <button class="back-btn" onclick="history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <div class="chat-header-info">
            <div class="avatar" id="headerIcon">
                <!-- آیکون بر اساس نوع چت تنظیم می‌شود -->
            </div>
            <div>
                <div class="chat-title" id="headerTitle">چت پشتیبانی</div>
                <div class="chat-subtitle" id="headerSubtitle">آنلاین</div>
            </div>
        </div>
    </header>

    <div class="chat-messages" id="chatMessages">
        <!-- پیام‌ها با JS اضافه می‌شوند -->
    </div>

    <footer class="chat-footer">
        <input type="text" class="chat-input" id="messageInput" placeholder="پیام خود را بنویسید..." autocomplete="off">
        <button class="send-btn" id="sendButton">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </footer>

    <script>
        (function() {
            // تشخیص نوع چت از URL
            const params = new URLSearchParams(window.location.search);
            const chatType = params.get('type') || 'ai'; // پیش‌فرض AI

            // تنظیم هدر بر اساس نوع
            const headerTitle = document.getElementById('headerTitle');
            const headerSubtitle = document.getElementById('headerSubtitle');
            const headerIcon = document.getElementById('headerIcon');

            if (chatType === 'ai') {
                headerTitle.textContent = 'دستیار هوش مصنوعی';
                headerSubtitle.textContent = 'پاسخگویی فوری';
                headerIcon.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M12.983 21.186a1 1 0 0 1-1.966 0 10 10 0 0 0-8.203-8.203 1 1 0 0 1 0-1.966 10 10 0 0 0 8.203-8.203 1 1 0 0 1 1.966 0 10 10 0 0 0 8.203 8.203 1 1 0 0 1 0 1.966 10 10 0 0 0-8.203 8.203"/></svg>`;
            } else {
                headerTitle.textContent = 'پشتیبانی نیوشاپ';
                headerSubtitle.textContent = 'پاسخ در ساعات اداری';
                headerIcon.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg>`;
            }

            // اعمال تم تاریک در صورت نیاز
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark');
            }

            const messagesContainer = document.getElementById('chatMessages');
            const messageInput = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendButton');

            // افزودن پیام به صفحه
            function addMessage(text, sender) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${sender}`;
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.textContent = text;
                msgDiv.appendChild(bubble);
                messagesContainer.appendChild(msgDiv);
                scrollToBottom();
            }

            // نمایش افکت تایپینگ
            function showTyping() {
                const typingDiv = document.createElement('div');
                typingDiv.className = 'message bot';
                typingDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
                typingDiv.id = 'typingIndicator';
                messagesContainer.appendChild(typingDiv);
                scrollToBottom();
            }

            function hideTyping() {
                const indicator = document.getElementById('typingIndicator');
                if (indicator) indicator.remove();
            }

            // پاسخ خودکار
            function getBotResponse(userMessage) {
                if (chatType === 'ai') {
                    // پاسخ‌های ساده هوش مصنوعی
                    const msg = userMessage.trim().toLowerCase();
                    if (msg.includes('سلام') || msg.includes('خوبی')) return 'سلام! من خوبم، چطور می‌تونم کمکت کنم؟ ';
                    if (msg.includes('قیمت') || msg.includes('تخفیف')) return 'می‌تونید بخش تخفیف‌های ویژه رو در سایت بررسی کنید. اگه محصول خاصی مد نظرتونه بگید راهنمایی کنم.';
                    if (msg.includes('پیگیری') || msg.includes('سفارش')) return 'برای پیگیری سفارش به صفحه "پیگیری سفارش" در سایت مراجعه کنید یا شماره سفارش رو اینجا بفرستید.';
                    return 'متوجه پیام شما شدم. لطفاً بیشتر توضیح بدید تا بهتر بتونم کمک کنم.';
                } else {
                    return 'کارشناسان ما در اسرع وقت پاسخگوی شما خواهند بود. لطفاً شماره تماس یا ایمیل خود را نیز بفرستید تا در صورت قطع ارتباط، پیگیری کنیم.';
                }
            }

            // ارسال پیام کاربر
            function sendMessage() {
                const text = messageInput.value.trim();
                if (!text) return;
                addMessage(text, 'user');
                messageInput.value = '';
                messageInput.focus();

                // نمایش تایپینگ و سپس پاسخ
                showTyping();
                setTimeout(() => {
                    hideTyping();
                    const response = getBotResponse(text);
                    addMessage(response, 'bot');
                }, 1500);
            }

            // رویدادها
            sendButton.addEventListener('click', sendMessage);
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            function scrollToBottom() {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            // پیام خوش‌آمدگویی اولیه
            window.addEventListener('DOMContentLoaded', () => {
                const welcomeMsg = chatType === 'ai'
                    ? 'سلام! من دستیار هوش مصنوعی نیوشاپ هستم. هر سوالی دارید بپرسید.'
                    : 'سلام 👋\nبه بخش پشتیبانی نیوشاپ خوش آمدید. پیام خود را بنویسید تا همکاران ما پاسخ دهند.';
                addMessage(welcomeMsg, 'bot');
            });
        })();
    </script>
</body>
</html>
